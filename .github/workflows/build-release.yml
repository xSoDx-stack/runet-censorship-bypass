name: Build and Release AntiCheburnet

on:
  push:
    branches:
      - development
    tags:
      - 'v*'
  pull_request:
    branches:
      - development
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: anticheburnet-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, Test, Browser Smoke & Build
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js 22.x
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extensions/browser/runet-censorship-bypass/package-lock.json

      - name: Install locked dependencies
        working-directory: extensions/browser/runet-censorship-bypass
        run: npm ci --no-audit --no-fund

      - name: Verify registry signatures
        working-directory: extensions/browser/runet-censorship-bypass
        run: npm audit signatures

      - name: Audit dependencies
        working-directory: extensions/browser/runet-censorship-bypass
        run: npm run audit:ci

      - name: Verify project version is synchronized
        run: npm run version:check

      - name: Run code linter
        working-directory: extensions/browser/runet-censorship-bypass
        run: npm run lint

      - name: Run automated unit tests
        working-directory: extensions/browser/runet-censorship-bypass
        run: npm test

      - name: Build Chromium and Firefox extensions
        working-directory: extensions/browser/runet-censorship-bypass
        run: npm run release:all

      - name: Validate Firefox extension
        working-directory: extensions/browser/runet-censorship-bypass
        run: npm run lint:firefox

      - name: Run Chrome Stable MV3 browser smoke
        working-directory: extensions/browser/runet-censorship-bypass
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: npm run test:browser:chrome

      - name: Verify generated build is committed and current
        run: git diff --exit-code

      - name: Extract extension version
        shell: bash
        run: |
          version=$(node -p "require('./extensions/browser/runet-censorship-bypass/build/extension-chromium/manifest.json').version")
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Create Chrome Web Store archive
        shell: bash
        run: |
          cd extensions/browser/runet-censorship-bypass/build/extension-chromium
          zip -r "$GITHUB_WORKSPACE/anticheburnet-v${VERSION}-chrome-mv3.zip" .

      - name: Create Firefox archive
        shell: bash
        run: |
          cd extensions/browser/runet-censorship-bypass/build/extension-firefox
          zip -r "$GITHUB_WORKSPACE/anticheburnet-v${VERSION}-firefox-mv3.zip" .

      - name: Sign Firefox extension through AMO
        if: >-
          github.ref == 'refs/heads/development' ||
          startsWith(github.ref, 'refs/tags/v') ||
          github.event_name == 'workflow_dispatch'
        working-directory: extensions/browser/runet-censorship-bypass
        shell: bash
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          test -n "$WEB_EXT_API_KEY"
          test -n "$WEB_EXT_API_SECRET"
          rm -rf web-ext-signed-artifacts
          npm run sign:firefox
          signed_xpi=$(find web-ext-signed-artifacts -maxdepth 1 -type f -name '*.xpi' -print -quit)
          test -n "$signed_xpi"
          unzip -Z1 "$signed_xpi" | grep -Eq '^META-INF/(cose\.sig|mozilla\.rsa)$'
          cp "$signed_xpi" "$GITHUB_WORKSPACE/anticheburnet-v${VERSION}-firefox-mv3.xpi"

      - name: Upload verified Chrome artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: anticheburnet-v${{ env.VERSION }}-chrome-mv3
          path: anticheburnet-v${{ env.VERSION }}-chrome-mv3.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload verified Firefox artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: anticheburnet-v${{ env.VERSION }}-firefox-mv3
          path: anticheburnet-v${{ env.VERSION }}-firefox-mv3.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload signed Firefox artifact
        if: >-
          github.ref == 'refs/heads/development' ||
          startsWith(github.ref, 'refs/tags/v') ||
          github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: anticheburnet-v${{ env.VERSION }}-firefox-mv3-signed
          path: anticheburnet-v${{ env.VERSION }}-firefox-mv3.xpi
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs: verify
    if: >-
      github.ref == 'refs/heads/development' ||
      startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve release version and tag
        shell: bash
        run: |
          version=$(node -p "require('./extensions/browser/runet-censorship-bypass/build/extension-chromium/manifest.json').version")
          release_tag="v${version}"
          if [[ "${GITHUB_REF}" == refs/tags/* && "${GITHUB_REF_NAME}" != "${release_tag}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match extension version ${release_tag}" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$release_tag" >> "$GITHUB_ENV"

      - name: Download the verified archive from this workflow run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/release-artifact"
          gh run download "$GITHUB_RUN_ID" \
            --name "anticheburnet-v${VERSION}-chrome-mv3" \
            --dir "$RUNNER_TEMP/release-artifact"
          gh run download "$GITHUB_RUN_ID" \
            --name "anticheburnet-v${VERSION}-firefox-mv3-signed" \
            --dir "$RUNNER_TEMP/release-artifact"
          chrome_archive="$RUNNER_TEMP/release-artifact/anticheburnet-v${VERSION}-chrome-mv3.zip"
          firefox_archive="$RUNNER_TEMP/release-artifact/anticheburnet-v${VERSION}-firefox-mv3.xpi"
          test -f "$chrome_archive"
          test -f "$firefox_archive"
          sha256sum "$chrome_archive" > "$chrome_archive.sha256"
          sha256sum "$firefox_archive" > "$firefox_archive.sha256"

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${RELEASE_TAG}"
          chrome_archive="$RUNNER_TEMP/release-artifact/anticheburnet-v${VERSION}-chrome-mv3.zip"
          firefox_archive="$RUNNER_TEMP/release-artifact/anticheburnet-v${VERSION}-firefox-mv3.xpi"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; refusing to overwrite its assets." >&2
            exit 1
          fi
          target_args=()
          if [[ "${GITHUB_REF}" != refs/tags/* ]]; then
            target_args=(--target "$GITHUB_SHA")
          fi
          gh release create "$tag" \
            "$chrome_archive" "$chrome_archive.sha256" \
            "$firefox_archive" "$firefox_archive.sha256" \
            "${target_args[@]}" \
            --generate-notes \
            --title "АнтиЧебурнет v${VERSION}"
