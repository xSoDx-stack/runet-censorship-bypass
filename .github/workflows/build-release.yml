name: Build and Release AntiCheburnet

on:
  push:
    branches:
      - development
    tags:
      - 'v*'
  pull_request:
    branches:
      - development
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: anticheburnet-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, Test, Browser Smoke & Build
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js 22.x
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extensions/chromium/runet-censorship-bypass/package-lock.json

      - name: Install locked dependencies
        working-directory: extensions/chromium/runet-censorship-bypass
        run: npm ci --no-audit --no-fund

      - name: Verify registry signatures
        working-directory: extensions/chromium/runet-censorship-bypass
        run: npm audit signatures

      - name: Audit dependencies
        working-directory: extensions/chromium/runet-censorship-bypass
        run: npm audit --audit-level=high --no-fund

      - name: Verify project version is synchronized
        run: npm run version:check

      - name: Run code linter
        working-directory: extensions/chromium/runet-censorship-bypass
        run: npm run lint

      - name: Run automated unit tests
        working-directory: extensions/chromium/runet-censorship-bypass
        run: npm test

      - name: Build extension
        working-directory: extensions/chromium/runet-censorship-bypass
        run: npm run release

      - name: Run Chrome Stable MV3 browser smoke
        working-directory: extensions/chromium/runet-censorship-bypass
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: npm run test:browser:chrome

      - name: Verify generated build is committed and current
        run: git diff --exit-code

      - name: Extract extension version
        shell: bash
        run: |
          version=$(node -p "require('./extensions/chromium/runet-censorship-bypass/build/extension-full/manifest.json').version")
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Create Chrome Web Store archive
        shell: bash
        run: |
          cd extensions/chromium/runet-censorship-bypass/build/extension-full
          zip -r "$GITHUB_WORKSPACE/anticheburnet-v${VERSION}-chrome-mv3.zip" .

      - name: Upload verified artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: anticheburnet-v${{ env.VERSION }}-chrome-mv3
          path: anticheburnet-v${{ env.VERSION }}-chrome-mv3.zip
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify release tag matches extension version
        shell: bash
        run: |
          version=$(node -p "require('./extensions/chromium/runet-censorship-bypass/build/extension-full/manifest.json').version")
          if [[ "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match extension version v${version}" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Download the verified archive from this workflow run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/release-artifact"
          gh run download "$GITHUB_RUN_ID" \
            --name "anticheburnet-v${VERSION}-chrome-mv3" \
            --dir "$RUNNER_TEMP/release-artifact"
          archive="$RUNNER_TEMP/release-artifact/anticheburnet-v${VERSION}-chrome-mv3.zip"
          test -f "$archive"
          sha256sum "$archive" > "$archive.sha256"

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${VERSION}"
          archive="$RUNNER_TEMP/release-artifact/anticheburnet-v${VERSION}-chrome-mv3.zip"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; refusing to overwrite its assets." >&2
            exit 1
          fi
          gh release create "$tag" "$archive" "$archive.sha256" \
            --generate-notes \
            --title "АнтиЧебурнет v${VERSION}"
